name: Deploy Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "data/cleaned/accuracy_markets.csv"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages bundle
        run: |
          mkdir -p site/dashboard
          mkdir -p site/data/cleaned
          cp -R dashboard/. site/dashboard/
          cp data/cleaned/accuracy_markets.csv site/data/cleaned/accuracy_markets.csv

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
