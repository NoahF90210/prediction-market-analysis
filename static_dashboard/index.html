<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prediction Market Accuracy Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      html, body { margin: 0; padding: 0; background: #f8fafc; }
      body { font-family: 'Inter Tight', system-ui, sans-serif; color: #0f172a; }
      * { box-sizing: border-box; }
      ::selection { background: #2563eb; color: #fff; }
      input[type="search"]::placeholder { color: #94a3b8; }
      input[type="search"]:focus { border-color: #2563eb !important; }
      button:hover { filter: brightness(0.97); }

      /* ----- responsive grids ----- */
      .grid-kpi {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .grid-cal {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 16px;
      }
      .grid-bucket {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .table-scroll {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .table-scroll table { min-width: 760px; }
      .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .filter-bar .spacer { flex: 1; min-width: 12px; }

      @media (max-width: 1024px) {
        .hero-grid { grid-template-columns: 1fr !important; }
        .grid-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .grid-cal { grid-template-columns: 1fr; }
      }
      @media (max-width: 768px) {
        .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-2 { grid-template-columns: 1fr; }
        .grid-bucket { grid-template-columns: 1fr; }
        .filter-bar input[type="search"] { width: 100% !important; }
      }
      @media (max-width: 480px) {
        .grid-kpi { grid-template-columns: 1fr; }
      }

      /* Responsive grid utilities */
      .kpi-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 12px;
      }
      .split-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .calib-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 16px;
      }
      .struct-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .findings-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 24px;
      }
      .table-scroll {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .filter-bar > .filter-search {
        width: 240px;
        min-width: 160px;
      }

      @media (max-width: 1100px) {
        .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .calib-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 820px) {
        .split-grid { grid-template-columns: 1fr; }
        .struct-grid { grid-template-columns: 1fr; }
        .findings-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 560px) {
        .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .filter-bar > .filter-search { width: 100%; }
      }
      @media (max-width: 380px) {
        .kpi-grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

    <script src="data.js"></script>
    <script type="text/babel" src="charts.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
