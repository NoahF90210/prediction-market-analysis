<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A verified analysis of Polymarket YES probabilities and resolved outcomes during 2025.">
    <title>Prediction Market Probability Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #ffffff;
        --paper: #ffffff;
        --ink: #182019;
        --muted: #66736a;
        --line: #d8d7ca;
        --forest: #2E5CFF;
        --forest-dark: #1d3fc5;
        --teal: #2E5CFF;
        --mint: #e8efff;
        --coral: #d9684f;
        --coral-soft: #f8dfd8;
        --amber-soft: #f6e8c8;
        --shadow: 0 16px 42px rgba(38, 49, 38, .06);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #ffffff; color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
      a { color: var(--forest); font-weight: 700; text-underline-offset: 3px; }
      .page { width: min(1160px, calc(100% - 48px)); margin: 0 auto; }
      .hero { overflow: hidden; position: relative; padding: 20px 0 0; background: #ffffff; color: #ffffff; }
      .hero::after { content: ""; position: absolute; width: 620px; height: 620px; right: -170px; top: -330px; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; box-shadow: 0 0 0 70px rgba(255,255,255,.05), 0 0 0 140px rgba(255,255,255,.035); }
      .hero-inner { position: relative; z-index: 1; padding: 34px 40px 38px; border-radius: 18px; background: var(--forest); }
      .kicker { display: flex; justify-content: flex-start; align-items: center; gap: 24px; color: #dfe7ff; font: 11px Georgia, "Times New Roman", serif; letter-spacing: .11em; text-transform: uppercase; }
      .brand-lockup { display: inline-flex; align-items: center; gap: 8px; color: white; font: 700 16px Georgia, "Times New Roman", serif; letter-spacing: -.02em; text-decoration: none; text-transform: none; }
      .brand-lockup img { width: 22px; height: 22px; object-fit: contain; }
      .project-label { flex: 1; }
      .pill { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 7px 11px; color: white; background: rgba(255,255,255,.08); white-space: nowrap; letter-spacing: .03em; text-transform: none; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #dfe7ff; }
      h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; }
      h1 { max-width: 900px; margin: 52px 0 18px; font-size: clamp(48px, 8vw, 88px); line-height: .92; letter-spacing: -.045em; }
      .hero-lede { max-width: 720px; margin: 0; color: #ffffff; font-size: clamp(18px, 2.2vw, 23px); line-height: 1.5; }
      .scope { display: grid; grid-template-columns: 1.4fr 1fr; gap: 1px; margin-top: 28px; overflow: hidden; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; background: rgba(255,255,255,.18); }
      .scope div { display: grid; gap: 6px; padding: 15px 17px; background: rgba(0,0,0,.13); }
      .scope span, .eyebrow, .mono-label { color: var(--teal); font: 11px Georgia, "Times New Roman", serif; letter-spacing: .1em; text-transform: uppercase; }
      .scope span { color: #dfe7ff; }
      .scope strong { font-size: 13px; line-height: 1.42; }
      main { padding: 68px 0 32px; }
      section + section { margin-top: 76px; }
      .section-head { margin-bottom: 24px; }
      .section-head h2 { max-width: 1000px; margin: 0; font-size: clamp(34px, 5vw, 54px); line-height: .98; letter-spacing: -.03em; }
      .section-head p { max-width: 760px; margin: 13px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
      .eyebrow { padding-top: 9px; }
      .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .card, .bucket, .robustness, .evidence, details { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: var(--shadow); }
      .card { min-height: 178px; padding: 20px; }
      .card-label { color: var(--muted); font: 10px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
      .card-value { margin-top: 21px; color: var(--forest); font: 50px Georgia, "Times New Roman", serif; line-height: .9; }
      .card-note { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.48; }
      .bucket-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
      .bucket { padding: 17px; }
      .bucket-head { display: flex; justify-content: space-between; gap: 8px; padding-bottom: 15px; border-bottom: 1px solid var(--line); }
      .bucket-head strong { font: 13px "DM Mono", monospace; }
      .bucket-head span { color: var(--muted); font-size: 11px; }
      .measure { margin-top: 20px; }
      .measure-line { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
      .measure-line strong { color: var(--ink); font: 12px "DM Mono", monospace; }
      .track { height: 8px; overflow: hidden; border-radius: 999px; background: #e9e7df; }
      .bar { display: block; height: 100%; min-width: 2px; border-radius: inherit; }
      .bar.prediction { background: var(--teal); }
      .bar.outcome { background: var(--coral); }
      .gap { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); font: 11px "DM Mono", monospace; }
      .gap.negative { color: #9a4b39; }
      .gap.positive { color: var(--teal); }
      .robustness { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; overflow: hidden; background: var(--line); }
      .robust-column { padding: 24px; background: var(--paper); }
      .robust-column.primary { background: var(--forest-dark); color: white; }
      .robust-column h3 { margin: 0; font-size: 30px; line-height: 1; }
      .robust-column p { color: var(--muted); font-size: 13px; line-height: 1.55; }
      .robust-column.primary p { color: #c9d9d0; }
      .robust-stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px; }
      .robust-stat span { display: grid; gap: 5px; color: var(--muted); font: 10px "DM Mono", monospace; text-transform: uppercase; }
      .robust-column.primary .robust-stat span { color: #a9c0b5; }
      .robust-stat strong { color: var(--forest); font: 24px Georgia, "Times New Roman", serif; }
      .robust-column.primary .robust-stat strong { color: white; }
      .note { margin-top: 14px; padding: 15px 17px; border-left: 4px solid var(--coral); border-radius: 7px; background: var(--coral-soft); color: #54352d; font-size: 13px; line-height: 1.55; }
      .plain-explainer { max-width: 900px; margin: -4px 0 20px; padding: 18px 20px; border-left: 4px solid var(--teal); border-radius: 8px; background: var(--mint); color: #203f8f; font-size: 15px; line-height: 1.58; }
      .plain-explainer strong { font-weight: 700; }
      .chart-shell { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 12px; background: var(--paper); box-shadow: var(--shadow); }
      #bucket-chart { width: 100%; height: 470px; }
      .chart-caption { margin: 5px 4px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .bar-chart { display: grid; grid-template-columns: 35px 1fr; gap: 9px; margin: 22px 0 14px; }
      .bar-axis { display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 23px; color: var(--muted); font: 9px "DM Mono", monospace; }
      .bar-plot { height: 139px; border-bottom: 1px solid var(--ink); background: repeating-linear-gradient(to bottom, transparent 0, transparent 68px, rgba(216, 215, 202, .75) 69px, transparent 70px); }
      .bar-columns { display: flex; justify-content: center; align-items: end; gap: 14px; height: 100%; }
      .bar-column { display: flex; flex-direction: column; align-items: center; justify-content: end; height: 100%; color: var(--muted); font-size: 9px; white-space: nowrap; }
      .bar-column strong { margin-bottom: 5px; color: var(--ink); font: 11px "DM Mono", monospace; }
      .bar-track { display: flex; align-items: end; justify-content: center; width: 32px; height: 104px; }
      .vertical-bar { display: block; width: 100%; min-height: 3px; border-radius: 5px 5px 0 0; }
      .vertical-bar.prediction { background: var(--teal); }
      .vertical-bar.outcome { background: var(--coral); }
      .bar-column > span { margin-top: 6px; }
      .evidence { overflow: hidden; }
      .evidence-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; padding: 20px; border-bottom: 1px solid var(--line); }
      .evidence-head h3 { margin: 0; font-size: 30px; }
      .evidence-head p { max-width: 490px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .table-scroll { overflow-x: auto; }
      table { width: 100%; min-width: 830px; border-collapse: collapse; }
      th { padding: 12px 14px; color: var(--muted); background: #f7f5ee; font: 9px "DM Mono", monospace; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
      td { padding: 14px; border-top: 1px solid #e8e6dc; vertical-align: top; font-size: 12px; }
      .market-title { max-width: 400px; font-weight: 700; line-height: 1.38; }
      .market-id { margin-top: 4px; color: var(--muted); font: 9px "DM Mono", monospace; }
      .outcome { display: inline-flex; border-radius: 999px; padding: 5px 8px; font: 10px "DM Mono", monospace; text-transform: uppercase; }
      .outcome.yes { color: #1d3fc5; background: var(--mint); }
      .outcome.no { color: #7a3526; background: var(--coral-soft); }
      .probability { color: var(--forest); font: 22px Georgia, "Times New Roman", serif; }
      .date { min-width: 160px; color: var(--muted); line-height: 1.4; }
      details { overflow: hidden; }
      summary { padding: 20px; cursor: pointer; font-weight: 700; }
      .details-body { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 0 20px 22px; border-top: 1px solid var(--line); }
      .details-body h3 { margin: 20px 0 8px; font-size: 25px; }
      .details-body p, .details-body li { color: var(--muted); font-size: 13px; line-height: 1.58; }
      .details-body ul { margin: 0; padding-left: 18px; }
      footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 58px; padding: 20px 0; border-top: 1px solid var(--line); color: var(--muted); font: 9px "DM Mono", monospace; letter-spacing: .07em; text-transform: uppercase; }
      @media (max-width: 1040px) { .bucket-grid { grid-template-columns: repeat(3, 1fr); } .cards { grid-template-columns: repeat(2, 1fr); } }
      @media (max-width: 760px) { .page { width: min(100% - 30px, 1160px); } .hero-inner { padding-top: 28px; } .kicker { align-items: flex-start; flex-direction: column; } h1 { margin-top: 38px; } .scope, .section-head { grid-template-columns: 1fr; } .section-head { gap: 8px; } .eyebrow { padding-top: 0; } .bucket-grid, .cards, .robustness, .details-body { grid-template-columns: 1fr; } .robust-stat { grid-template-columns: repeat(3, 1fr); } .evidence-head { display: grid; } #bucket-chart { height: 420px; } main { padding-top: 46px; } section + section { margin-top: 58px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="data.js"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
