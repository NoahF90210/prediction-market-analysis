<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A compact portfolio analysis of whether pre-result prediction-market probabilities were informative.">
    <title>Prediction Market Probability Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap" rel="stylesheet">
    <style>
      :root {
        --background: #f5f2ea;
        --paper: #fffdf8;
        --ink: #182019;
        --muted: #657066;
        --line: #d8d7ca;
        --forest: #214e3d;
        --teal: #2f7d6b;
        --mint: #d9eee6;
        --coral: #d9684f;
        --coral-soft: #f8dfd8;
        --amber: #9a6517;
        --amber-soft: #f6e8c8;
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--background); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
      button, input { font: inherit; }
      a { color: var(--forest); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }
      ::selection { background: var(--forest); color: white; }
      .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
      .hero { position: relative; overflow: hidden; background: var(--forest); color: #f7f4eb; }
      .hero::before { content: ""; position: absolute; width: 520px; height: 520px; right: -120px; top: -250px; border: 1px solid rgba(255,255,255,.16); border-radius: 50%; box-shadow: 0 0 0 70px rgba(255,255,255,.035), 0 0 0 140px rgba(255,255,255,.025); }
      .hero-inner { position: relative; padding-top: 52px; padding-bottom: 48px; }
      .hero-kicker { display: flex; align-items: center; justify-content: space-between; gap: 18px; font-family: "DM Mono", monospace; text-transform: uppercase; letter-spacing: .09em; font-size: 11px; font-weight: 500; }
      .hero h1 { max-width: 900px; margin: 52px 0 16px; font-family: "Newsreader", Georgia, serif; font-size: clamp(48px, 8vw, 84px); line-height: .94; letter-spacing: -.035em; }
      .hero-summary { max-width: 730px; margin: 0; color: #d9e2dc; font-size: clamp(17px, 2vw, 21px); line-height: 1.55; }
      .status-pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 7px 11px; color: white; background: rgba(255,255,255,.08); white-space: nowrap; }
      .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #f3c969; }
      .status-real .status-dot { background: #75d7a9; }
      .status-pending .status-dot { background: #f2a76f; }
      .status-banner { max-width: 930px; margin-top: 30px; border-radius: 10px; padding: 15px 17px; line-height: 1.55; }
      .status-banner.fixture { color: #51291f; background: #f5d4ca; }
      .status-banner.pending { color: #543812; background: #f3dfb7; }
      .status-banner.real { color: #153d2e; background: #cce9dc; }
      .scope-strip { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1px; margin-top: 28px; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.18); }
      .scope-strip > div { display: grid; gap: 5px; padding: 14px 16px; background: rgba(19,52,39,.85); }
      .scope-strip span { font-family: "DM Mono", monospace; color: #aac0b5; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
      .scope-strip strong { font-size: 13px; line-height: 1.45; }
      .main-content { padding-top: 64px; padding-bottom: 36px; }
      .section-space { margin-top: 76px; }
      .section-header { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 28px; align-items: start; margin-bottom: 24px; }
      .eyebrow { padding-top: 9px; color: var(--teal); font-family: "DM Mono", monospace; text-transform: uppercase; letter-spacing: .09em; font-size: 11px; font-weight: 500; }
      .section-header h2 { margin: 0; font-family: "Newsreader", Georgia, serif; font-size: clamp(34px, 5vw, 52px); line-height: 1; letter-spacing: -.025em; }
      .section-header p { max-width: 760px; margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
      .legend { display: flex; justify-content: flex-end; gap: 20px; margin: -8px 0 14px; color: var(--muted); font-size: 12px; }
      .legend span { display: inline-flex; align-items: center; gap: 7px; }
      .legend i { width: 18px; height: 6px; border-radius: 999px; }
      .legend-probability { background: var(--teal); }
      .legend-outcome { background: var(--coral); }
      .bucket-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
      .bucket-card, .metric-card, .table-card, .coverage-note, .claim-boundary, details { border: 1px solid var(--line); background: var(--paper); box-shadow: 0 12px 30px rgba(38,49,38,.045); }
      .bucket-card { min-height: 232px; padding: 17px; border-radius: 10px; }
      .bucket-topline { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
      .bucket-topline strong { font-family: "DM Mono", monospace; font-size: 13px; }
      .bucket-topline span { color: var(--muted); font-size: 11px; }
      .measure { margin-top: 20px; }
      .measure-label { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 7px; color: var(--muted); font-size: 11px; }
      .measure-label strong { color: var(--ink); font-family: "DM Mono", monospace; font-size: 12px; }
      .track { height: 8px; overflow: hidden; border-radius: 999px; background: #e8e7df; }
      .bar { display: block; height: 100%; border-radius: inherit; min-width: 2px; }
      .probability-bar { background: var(--teal); }
      .outcome-bar { background: var(--coral); }
      .empty-bucket { display: grid; place-items: center; min-height: 150px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.5; }
      .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .metric-card { min-height: 200px; padding: 21px; border-radius: 10px; }
      .metric-label { color: var(--muted); font-family: "DM Mono", monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
      .metric-value { margin-top: 22px; font-family: "Newsreader", Georgia, serif; font-size: 50px; line-height: 1; color: var(--forest); }
      .metric-note { margin-top: 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }
      .claim-boundary { margin-top: 12px; padding: 15px 17px; border-radius: 8px; border-left: 4px solid var(--coral); color: #4d3c34; line-height: 1.55; }
      .coverage-note { margin-top: 12px; padding: 16px 17px; border-radius: 8px; }
      .reason-chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .reason-chips span { padding: 6px 9px; border-radius: 999px; background: var(--amber-soft); color: #624312; font-size: 11px; }
      .table-card { overflow: hidden; border-radius: 10px; }
      .table-controls { display: grid; grid-template-columns: minmax(280px, 1fr) auto auto; gap: 14px; align-items: end; padding: 17px; border-bottom: 1px solid var(--line); }
      .search-box { display: grid; gap: 7px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
      .search-box input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; background: white; color: var(--ink); outline: none; }
      .search-box input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--mint); }
      .filter-group { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: #f2f1e9; }
      .filter-group button { border: 0; border-radius: 5px; padding: 8px 10px; color: var(--muted); background: transparent; cursor: pointer; text-transform: capitalize; font-size: 12px; }
      .filter-group button.active { color: white; background: var(--forest); }
      .row-count { padding-bottom: 9px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 11px; white-space: nowrap; }
      .table-scroll { overflow-x: auto; }
      table { width: 100%; min-width: 1120px; border-collapse: collapse; }
      th { padding: 12px 14px; border-bottom: 1px solid var(--line); color: var(--muted); background: #f7f5ee; font-family: "DM Mono", monospace; font-size: 9px; font-weight: 500; letter-spacing: .08em; text-align: left; text-transform: uppercase; }
      td { padding: 15px 14px; border-bottom: 1px solid #e8e6dc; vertical-align: top; font-size: 13px; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #faf9f3; }
      .excluded-row { opacity: .68; }
      .row-status, .outcome { display: inline-flex; border-radius: 999px; padding: 4px 7px; font-family: "DM Mono", monospace; font-size: 9px; font-weight: 500; text-transform: uppercase; }
      .row-status.included, .outcome.yes { color: #16533d; background: var(--mint); }
      .row-status.excluded, .outcome.no { color: #7a3526; background: var(--coral-soft); }
      .outcome.unknown { color: var(--muted); background: #ecebe5; }
      .reason-text { max-width: 170px; margin-top: 7px; color: var(--muted); font-size: 10px; line-height: 1.4; }
      .number-cell { font-family: "Newsreader", Georgia, serif; font-size: 24px; color: var(--forest); }
      .date-cell { min-width: 165px; color: var(--muted); line-height: 1.45; }
      .platform-cell { font-family: "DM Mono", monospace; font-size: 11px; }
      .market-title { max-width: 330px; font-weight: 700; line-height: 1.4; }
      .market-id { margin-top: 5px; color: var(--muted); font-family: "DM Mono", monospace; font-size: 9px; }
      .empty-table { padding: 34px; color: var(--muted); text-align: center; }
      details { border-radius: 10px; }
      summary { padding: 19px 21px; cursor: pointer; font-weight: 700; }
      .appendix-body { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px; padding: 0 21px 22px; border-top: 1px solid var(--line); }
      .appendix-body h3 { margin: 20px 0 8px; font-family: "Newsreader", Georgia, serif; font-size: 24px; }
      .appendix-body p, .appendix-body li { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .appendix-body ul { margin: 0; padding-left: 18px; }
      .technical-values { display: flex; flex-wrap: wrap; gap: 8px; }
      .technical-values span { padding: 8px 10px; border-radius: 6px; background: #f1f0e8; font-family: "DM Mono", monospace; font-size: 10px; }
      footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 58px; padding: 20px 0; border-top: 1px solid var(--line); color: var(--muted); font-family: "DM Mono", monospace; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
      @media (max-width: 1050px) {
        .bucket-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .appendix-body { grid-template-columns: 1fr; gap: 0; }
      }
      @media (max-width: 760px) {
        .page { width: min(100% - 30px, 1180px); }
        .hero-inner { padding-top: 30px; padding-bottom: 30px; }
        .hero-kicker { align-items: flex-start; flex-direction: column; }
        .hero h1 { margin-top: 38px; }
        .scope-strip, .section-header { grid-template-columns: 1fr; }
        .section-header { gap: 7px; }
        .eyebrow { padding-top: 0; }
        .legend { justify-content: flex-start; flex-wrap: wrap; }
        .bucket-grid { grid-template-columns: 1fr; }
        .bucket-card { min-height: 0; }
        .metric-grid { grid-template-columns: 1fr; }
        .metric-card { min-height: 0; }
        .table-controls { grid-template-columns: 1fr; align-items: stretch; }
        .filter-group { justify-content: stretch; }
        .filter-group button { flex: 1; }
        .row-count { padding: 0; }
        .main-content { padding-top: 46px; }
        .section-space { margin-top: 58px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="data.js"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
