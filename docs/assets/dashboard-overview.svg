<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Forecast Audit rebuild status</title>
  <desc id="desc">Methodology-first dashboard showing protocol, completed safeguards, and blocked publication status without numerical findings.</desc>
  <rect width="1200" height="675" fill="#f6f8fb"/>
  <rect x="62" y="52" width="1076" height="570" rx="20" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="100" y="105" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">FORECAST AUDIT REBUILD</text>
  <rect x="930" y="78" width="132" height="34" rx="17" fill="#ffedd5"/>
  <text x="962" y="101" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">BLOCKED</text>
  <text x="100" y="180" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Methodology first.</text>
  <text x="100" y="225" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#0f172a">Results only after every evidence gate passes.</text>
  <text x="100" y="274" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">The full provenance-complete corpus remains under validation.</text>
  <g transform="translate(100 330)">
    <rect width="300" height="160" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="22" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b">PROTOCOL</text>
    <text x="22" y="72" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Fixed six-month window</text>
    <text x="22" y="104" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">24-hour target</text>
    <text x="22" y="132" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Event-total weighting</text>
  </g>
  <g transform="translate(430 330)">
    <rect width="300" height="160" rx="14" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="22" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#64748b">SAFEGUARDS</text>
    <text x="22" y="72" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Hashed raw responses</text>
    <text x="22" y="104" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Fail-closed timing gates</text>
    <text x="22" y="132" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Clustered uncertainty</text>
  </g>
  <g transform="translate(760 330)">
    <rect width="300" height="160" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="22" y="34" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#b45309">PUBLICATION</text>
    <text x="22" y="72" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#7c2d12">No result metric shown</text>
    <text x="22" y="104" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9a3412">Real corpus incomplete</text>
    <text x="22" y="132" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9a3412">Claims remain blocked</text>
  </g>
</svg>
