    <text x="22" y="78" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="#0f172a">769</text>
  </g>
  <g transform="translate(270 258)">
    <rect width="170" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="22" y="42" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">BRIER</text>
    <text x="22" y="78" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="#0f172a">0.1397</text>
  </g>
  <g transform="translate(464 258)">
    <rect width="170" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="22" y="42" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#64748b">VOLUME</text>
    <text x="22" y="78" font-family="JetBrains Mono, monospace" font-size="32" font-weight="700" fill="#0f172a">$815M</text>
  </g>
  <g transform="translate(96 420)">
    <rect width="960" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="38" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Screenshot placeholder</text>
    <text x="28" y="68" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Capture the deployed dashboard after final visual review and replace this SVG.</text>
  </g>
