<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard overview screenshot placeholder</title>
  <desc id="desc">Placeholder card showing the intended first-screen dashboard screenshot area.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="60" y="54" width="1080" height="567" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="60" y="54" width="1080" height="88" rx="18" fill="#0f172a"/>
  <text x="96" y="104" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Forecast Audit Dashboard</text>
  <text x="96" y="178" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Were prediction markets accurate before outcomes were known?</text>
  <text x="96" y="212" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Replace this placeholder with a live screenshot of the dashboard hero, KPI row, and key findings.</text>
  <g transform="translate(96 258)">
    <rect width="150" height="110" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
