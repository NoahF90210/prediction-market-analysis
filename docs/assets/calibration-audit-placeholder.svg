<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Validation gates placeholder</title>
  <desc id="desc">A non-result placeholder showing the validation gates required before calibration charts and contract tables can be published.</desc>
  <rect width="1200" height="675" fill="#f6f8fb"/>
  <rect x="70" y="55" width="1060" height="565" rx="18" fill="#ffffff" stroke="#dbe3ee" stroke-width="2"/>
  <text x="110" y="120" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Charts remain intentionally unavailable</text>
  <text x="110" y="160" font-family="Inter, Arial, sans-serif" font-size="18" fill="#475569">Calibration and row-level findings appear only after the real corpus clears every gate.</text>
  <g transform="translate(110 220)" font-family="Inter, Arial, sans-serif">
    <g>
      <circle cx="18" cy="18" r="18" fill="#dcfce7"/><text x="12" y="24" font-size="18" font-weight="700" fill="#15803d">✓</text>
      <text x="58" y="24" font-size="19" font-weight="700" fill="#0f172a">Immutable raw manifests</text>
      <text x="58" y="52" font-size="16" fill="#64748b">Every source response is content-addressed and hash verified.</text>
    </g>
    <g transform="translate(0 95)">
      <circle cx="18" cy="18" r="18" fill="#dcfce7"/><text x="12" y="24" font-size="18" font-weight="700" fill="#15803d">✓</text>
      <text x="58" y="24" font-size="19" font-weight="700" fill="#0f172a">Event-safe evaluation</text>
      <text x="58" y="52" font-size="16" fill="#64748b">Related contracts share event weight and bootstrap clusters.</text>
    </g>
    <g transform="translate(0 190)">
      <circle cx="18" cy="18" r="18" fill="#ffedd5"/><text x="12" y="24" font-size="18" font-weight="700" fill="#b45309">!</text>
      <text x="58" y="24" font-size="19" font-weight="700" fill="#0f172a">Complete real collection</text>
      <text x="58" y="52" font-size="16" fill="#64748b">The frozen six-month corpus and manual grouping audit are pending.</text>
    </g>
    <g transform="translate(0 285)">
      <circle cx="18" cy="18" r="18" fill="#ffedd5"/><text x="12" y="24" font-size="18" font-weight="700" fill="#b45309">!</text>
      <text x="58" y="24" font-size="19" font-weight="700" fill="#0f172a">Generated-claim consistency</text>
      <text x="58" y="52" font-size="16" fill="#64748b">README and dashboard numbers must derive from one validated summary.</text>
    </g>
  </g>
</svg>
